<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POKER STORE - Suntik All Sosmed</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --card: #161616;
    --border: rgba(255,255,255,0.12);
    --red: #ff1e1e;
    --red-glow: #ff1e1e88;
    --white: #f0f0f0;
    --muted: #888;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  /* HEADER */
  header {
    position: relative;
    text-align: center;
    padding: 50px 20px 36px;
    background: radial-gradient(ellipse at top, #2a0000 0%, transparent 70%);
    border-bottom: 1px solid var(--border);
  }

  /* LOGO pojok kanan atas */
  .logo-badge {
    position: absolute;
    top: 16px;
    right: 16px;
  }

  .logo-badge img {
    width: 90px;
    height: 90px;
    object-fit: contain;
    border-radius: 14px;
    background: #000;
    display: block;
  }

  .title-main {
    font-family: 'Inter', sans-serif;
    font-size: clamp(28px, 7vw, 48px);
    font-weight: 700;
    line-height: 1.1;
    color: var(--red);
    text-shadow: 0 0 20px var(--red-glow);
    letter-spacing: 1px;
    animation: flicker 4s infinite;
  }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.8; }
    97% { opacity: 1; }
    98% { opacity: 0.6; }
    99% { opacity: 1; }
  }

  .title-sub {
    font-family: 'Inter', sans-serif;
    font-size: clamp(11px, 2.5vw, 14px);
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 3px;
    margin-top: 8px;
    text-transform: uppercase;
  }

  /* Tagline bawah header */
  .simple-tagline {
    text-align: center;
    padding: 13px 20px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }

  /* MAIN */
  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 30px 16px 80px;
  }

  /* Section Cards */
  .section-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  .section-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
  }

  .section-title {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .section-hint {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 14px;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
  }

  /* Buttons */
  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .btn-option {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--white);
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-option:hover,
  .btn-option.active {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
    box-shadow: 0 0 20px var(--red-glow);
    transform: translateY(-1px);
  }

  .btn-option.cat-active {
    background: #1f1010;
    border-color: var(--red);
    color: var(--red);
    box-shadow: 0 0 12px var(--red-glow);
  }

  /* Price Table */
  #price-section { display: none; }

  .price-header {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--red);
    letter-spacing: 1px;
    margin-bottom: 4px;
    text-shadow: 0 0 15px var(--red-glow);
  }

  .price-subheader {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 14px;
    font-family: 'Inter', sans-serif;
  }

  .price-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .price-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-decoration: none;
  }

  .price-item:hover {
    border-color: rgba(255,30,30,0.5);
    background: #1a0a0a;
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(255,30,30,0.15);
  }

  .price-qty {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }

  .price-val {
    font-family: 'Inter', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0;
  }

  .price-wa-hint {
    font-size: 10px;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 30px 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    font-family: 'Inter', sans-serif;
  }

  /* Float WA button */
  .wa-float {
    position: fixed;
    bottom: 24px;
    right: 20px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px 22px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 30px var(--red-glow);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 100;
    animation: bounce-float 2s ease-in-out infinite;
  }

  @keyframes bounce-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .no-data {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 20px;
    font-family: 'Inter', sans-serif;
  }

  @media (max-width: 420px) {
    .price-val { font-size: 15px; }
    .logo-badge img { width: 70px; height: 70px; }
  }
</style>
</head>
