<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POKER STORE - Suntik All Sosmed</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0010;
    --surface: #110020;
    --card: #160028;
    --border: rgba(160,100,255,0.22);
    --accent: #9d4edd;
    --accent-light: #c77dff;
    --accent-glow: rgba(157,78,221,0.55);
    --white: #f0eeff;
    --muted: #9980b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline overlay tipis */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(157,78,221,0.018) 2px, rgba(157,78,221,0.018) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  /* Efek smoke ungu di background */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 40%, rgba(90,24,154,0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 15%, rgba(157,78,221,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 55% 85%, rgba(90,24,154,0.15) 0%, transparent 55%);
    pointer-events: none;
    z-index: 0;
    animation: smokeDrift 9s ease-in-out infinite alternate;
  }
  @keyframes smokeDrift {
    0%   { opacity: 0.6; transform: scale(1); }
    100% { opacity: 1;   transform: scale(1.06); }
  }

  /* HEADER */
  header {
    position: relative;
    text-align: center;
    padding: 50px 20px 36px;
    background: radial-gradient(ellipse at top, #2d0060 0%, #110022 55%, transparent 100%);
    border-bottom: 1px solid var(--border);
    z-index: 1;
  }

  .logo-badge {
    position: absolute;
    top: 16px;
    right: 16px;
  }
  .logo-badge img {
    width: 90px;
    height: 90px;
    object-fit: contain;
    border-radius: 14px;
    background: #000;
    display: block;
    box-shadow: 0 0 20px var(--accent-glow);
  }

  .title-main {
    font-size: clamp(28px, 7vw, 48px);
    font-weight: 700;
    line-height: 1.1;
    color: var(--accent-light);
    text-shadow: 0 0 24px var(--accent-glow), 0 0 48px rgba(157,78,221,0.3);
    letter-spacing: 1px;
    animation: flicker 4s infinite;
  }
  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.85; }
    97% { opacity: 1; }
    98% { opacity: 0.65; }
    99% { opacity: 1; }
  }

  .title-sub {
    font-size: clamp(11px, 2.5vw, 14px);
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 3px;
    margin-top: 8px;
    text-transform: uppercase;
  }

  .tagline {
    text-align: center;
    padding: 13px 20px;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 1;
  }

  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 30px 16px 80px;
    position: relative;
    z-index: 1;
  }

  .section-card {
    background: rgba(22,0,40,0.85);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(4px);
  }
  .section-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .section-hint {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .btn-option {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--white);
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-option:hover, .btn-option.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 20px var(--accent-glow);
    transform: translateY(-1px);
  }
  .btn-option.cat-active {
    background: rgba(90,24,154,0.3);
    border-color: var(--accent);
    color: var(--accent-light);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  #price-section { display: none; }

  .price-header {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent-light);
    letter-spacing: 1px;
    margin-bottom: 4px;
    text-shadow: 0 0 15px var(--accent-glow);
  }
  .price-subheader {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .price-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .price-item {
    background: rgba(17,0,32,0.8);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-decoration: none;
  }
  .price-item:hover {
    border-color: rgba(157,78,221,0.55);
    background: rgba(40,0,70,0.8);
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(157,78,221,0.2);
  }
  .price-qty  { font-size: 12px; font-weight: 500; color: var(--muted); }
  .price-val  { font-size: 17px; font-weight: 700; color: var(--white); }
  .price-wa-hint { font-size: 10px; color: var(--muted); }

  footer {
    text-align: center;
    padding: 30px 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    position: relative;
    z-index: 1;
  }

  .wa-float {
    position: fixed;
    bottom: 24px;
    right: 20px;
    background: linear-gradient(135deg, #7b2fbe, #9d4edd);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px 22px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 30px var(--accent-glow);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 10000;
    animation: bounce-float 2s ease-in-out infinite;
  }
  @keyframes bounce-float {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-6px); }
  }

  .no-data {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 20px;
  }

  @media (max-width: 420px) {
    .price-val { font-size: 15px; }
    .logo-badge img { width: 70px; height: 70px; }
  }

  /* ── CHIBI POPUP ── */
  #chibi-popup {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    pointer-events: none;
  }
  #chibi-popup.show { display: block; }
  #chibi-card {
    position: absolute;
    bottom: 0; right: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: all;
    cursor: pointer;
    transform: translateY(100%);
    opacity: 0;
  }
  #chibi-popup.show #chibi-card {
    animation: chibiUp 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  #chibi-popup.hide #chibi-card {
    animation: chibiDown 0.35s ease-in forwards;
  }
  @keyframes chibiUp {
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes chibiDown {
    to { transform: translateY(110%); opacity: 0; }
  }
  #chibi-bubble {
    background: linear-gradient(135deg, #7b2fbe, #5a189a);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.5;
    padding: 10px 16px;
    border-radius: 18px 18px 18px 4px;
    margin-bottom: 8px;
    box-shadow: 0 4px 20px rgba(157,78,221,0.6);
    text-align: center;
    max-width: 200px;
    animation: bubPop 0.4s 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes bubPop {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  #chibi-img-el {
    width: 180px;
    filter: drop-shadow(0 -6px 20px rgba(157,78,221,0.7));
    animation: chibiFloat 2s ease-in-out infinite;
  }
  @keyframes chibiFloat {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-12px); }
  }
  @media (max-width: 480px) {
    #chibi-img-el { width: 130px; }
    #chibi-card { right: 8px; }
    #chibi-bubble { font-size: 11px; max-width: 155px; }
  }
</style>
</head>

let selLayanan = null, selKategori = null;

function selectLayanan(l) {
  selLayanan = l; selKategori = null;
  document.querySelectorAll('#layanan-group .btn-option').forEach(b => {
    b.classList.toggle('active', b.textContent === l);
  });
  const cats = Object.keys(DATA[l]);
  const catCard = document.getElementById('kategori-card');
  const catGroup = document.getElementById('kategori-group');
  catGroup.innerHTML = '';
  cats.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'btn-option';
    btn.textContent = c;
    btn.onclick = () => selectKategori(c);
    catGroup.appendChild(btn);
  });
  catCard.style.display = 'block';
  document.getElementById('price-section').style.display = 'none';
  catCard.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function selectKategori(k) {
  selKategori = k;
  document.querySelectorAll('#kategori-group .btn-option').forEach(b => {
    b.classList.toggle('cat-active', b.textContent === k);
    b.classList.remove('active');
  });
  showPrices();
}

function showPrices() {
  const items = DATA[selLayanan]?.[selKategori];
  const sec = document.getElementById('price-section');
  const grid = document.getElementById('price-grid');
  const hdr = document.getElementById('price-header');
  hdr.textContent = `${selKategori} ${selLayanan}`.toUpperCase();
  grid.innerHTML = '';
  if (!items || items.length === 0) {
    grid.innerHTML = '<div class="no-data">Data tidak tersedia</div>';
    sec.style.display = 'block';
    return;
  }
  items.forEach(([qty, price]) => {
    const msg = `Halo Admin Poker Store! 🃏\nSaya mau order:\n\n✅ Layanan: ${selLayanan}\n📦 Kategori: ${selKategori}\n🔢 Jumlah: ${qty}\n💰 Harga: Rp ${price}\n\nMohon diproses ya, terima kasih!`;
    const a = document.createElement('a');
    a.className = 'price-item';
    a.href = waLink(msg);
    a.target = '_blank';
    a.addEventListener('click', function() {
      const msgs = [
        'Siap bos! 👍<br>Lagi buka WhatsApp~',
        'Mantap! 🃏<br>Admin segera balas ya!',
        'Oke bos! ✅<br>Pesanan masuk nih~',
        'Gas! 🚀<br>Boost sosmed jalan!'
      ];
      showChibiPopup(msgs[Math.floor(Math.random()*msgs.length)]);
    });
    a.innerHTML = `
      <div class="price-qty">${qty}</div>
      <div class="price-val">Rp ${price}</div>
      <div class="price-wa-hint">Tap untuk order via WhatsApp</div>
    `;
    grid.appendChild(a);
  });
  sec.style.display = 'block';
  sec.scrollIntoView({behavior:'smooth', block:'nearest'});
}

  var popup = document.getElementById('chibi-popup');

  var card = document.getElementById('chibi-card');
  bubble.innerHTML = msg || 'Siap bos! 🃏 Pesanan masuk~';
  popup.classList.remove('hide');
  card.style.animation = 'none';
  void card.offsetWidth;

  popup.classList.add('show');

  _chibiTimer = setTimeout(closeChibiPopup, 3500);
}
function closeChibiPopup() {
  var popup = document.getElementById('chibi-popup');
  popup.classList.add('hide');
  setTimeout(function(){ popup.classList.remove('show','hide'); }, 380);
}

// Partikel ungu melayang
(function() {
  var shapes = ['✦','◆','⬡','✧','⬟','★'];
  function spawn() {
    var el = document.createElement('div');
    el.className = 'p-particle';
    var size = 8 + Math.random() * 14;
    var dur  = 9 + Math.random() * 11;
    var hue  = 260 + Math.random() * 40;
    el.style.cssText = 'left:' + (Math.random()*100) + 'vw;font-size:' + size + 'px;color:hsl(' + hue + ',75%,' + (55+Math.random()*25) + '%);animation-duration:' + dur + 's;text-shadow:0 0 6px hsl(' + hue + ',80%,70%)';
    el.textContent = shapes[Math.floor(Math.random()*shapes.length)];
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, dur*1000);
  }
  for(var i=0;i<6;i++) setTimeout(spawn, i*700);
  setInterval(spawn, 1400);
})();
</script>
</body>
</html>
