<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POKER STORE - Suntik All Sosmed</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --card: #161616;
    --border: rgba(255,255,255,0.12);
    --red: #ff1e1e;
    --red-glow: #ff1e1e88;
    --white: #f0f0f0;
    --muted: #888;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  /* HEADER */
  header {
    position: relative;
    text-align: center;
    padding: 50px 20px 36px;
    background: radial-gradient(ellipse at top, #2a0000 0%, transparent 70%);
    border-bottom: 1px solid var(--border);
  }

  /* LOGO pojok kanan atas */
  .logo-badge {
    position: absolute;
    top: 16px;
    right: 16px;
  }

  .logo-badge img {
    width: 90px;
    height: 90px;
    object-fit: contain;
    border-radius: 14px;
    background: #000;
    display: block;
  }

  .title-main {
    font-family: 'Inter', sans-serif;
    font-size: clamp(28px, 7vw, 48px);
    font-weight: 700;
    line-height: 1.1;
    color: var(--red);
    text-shadow: 0 0 20px var(--red-glow);
    letter-spacing: 1px;
    animation: flicker 4s infinite;
  }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.8; }
    97% { opacity: 1; }
    98% { opacity: 0.6; }
    99% { opacity: 1; }
  }

  .title-sub {
    font-family: 'Inter', sans-serif;
    font-size: clamp(11px, 2.5vw, 14px);
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 3px;
    margin-top: 8px;
    text-transform: uppercase;
  }

  /* Tagline bawah header */
  .simple-tagline {
    text-align: center;
    padding: 13px 20px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }

  /* MAIN */
  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 30px 16px 80px;
  }

  /* Section Cards */
  .section-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  .section-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
  }

  .section-title {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .section-hint {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 14px;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
  }

  /* Buttons */
  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .btn-option {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--white);
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-option:hover,
  .btn-option.active {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
    box-shadow: 0 0 20px var(--red-glow);
    transform: translateY(-1px);
  }

  .btn-option.cat-active {
    background: #1f1010;
    border-color: var(--red);
    color: var(--red);
    box-shadow: 0 0 12px var(--red-glow);
  }

  /* Price Table */
  #price-section { display: none; }

  .price-header {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--red);
    letter-spacing: 1px;
    margin-bottom: 4px;
    text-shadow: 0 0 15px var(--red-glow);
  }

  .price-subheader {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 14px;
    font-family: 'Inter', sans-serif;
  }

  .price-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .price-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-decoration: none;
  }

  .price-item:hover {
    border-color: rgba(255,30,30,0.5);
    background: #1a0a0a;
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(255,30,30,0.15);
  }

  .price-qty {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }

  .price-val {
    font-family: 'Inter', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0;
  }

  .price-wa-hint {
    font-size: 10px;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 30px 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    font-family: 'Inter', sans-serif;
  }

  /* Float WA button */
  .wa-float {
    position: fixed;
    bottom: 24px;
    right: 20px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px 22px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 30px var(--red-glow);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 100;
    animation: bounce-float 2s ease-in-out infinite;
  }

  @keyframes bounce-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .no-data {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 20px;
    font-family: 'Inter', sans-serif;
  }

  @media (max-width: 420px) {
    .price-val { font-size: 15px; }
    .logo-badge img { width: 70px; height: 70px; }
  }

  
  /* ── CHIBI ORDER POPUP ── */
  #chibi-popup {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    pointer-events: none;
  }
  #chibi-popup.show { display: block; }
  #chibi-card {
    position: absolute;
    bottom: 0;
    right: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: all;
    cursor: pointer;
    transform: translateY(100%);
    opacity: 0;
  }
  #chibi-popup.show #chibi-card {
    animation: chibiUp 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  #chibi-popup.hide #chibi-card {
    animation: chibiDown 0.35s ease-in forwards;
  }
  @keyframes chibiUp {
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes chibiDown {
    to { transform: translateY(110%); opacity: 0; }
  }
  #chibi-bubble {
    background: linear-gradient(135deg, #ff1e1e, #aa0000);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.5;
    padding: 10px 16px;
    border-radius: 18px 18px 18px 4px;
    margin-bottom: 8px;
    box-shadow: 0 4px 20px rgba(255,30,30,0.55);
    text-align: center;
    max-width: 200px;
    animation: bubPop 0.4s 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes bubPop {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  #chibi-img-el {
    width: 170px;
    filter: drop-shadow(0 -6px 20px rgba(255,30,30,0.5));
    animation: chibiFloat 2s ease-in-out infinite;
  }
  @keyframes chibiFloat {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-10px); }
  }
  @media (max-width: 480px) {
    #chibi-img-el { width: 125px; }
    #chibi-card { right: 8px; }
    #chibi-bubble { font-size: 11px; max-width: 155px; }
  }

  /* ── BANNER SLIDER ── */
  .banner-slider {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: #000;
    touch-action: pan-y;
  }
  .banner-track {
    display: flex;
    transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
    will-change: transform;
  }
  .banner-slide {
    min-width: 100%;
    position: relative;
  }
  .banner-slide img {
    width: 100%;
    height: auto;
    display: block;
    max-height: 260px;
    object-fit: cover;
  }
  .banner-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.55);
    color: #fff;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .banner-btn:hover { background: rgba(255,30,30,0.7); }
  .banner-btn.prev { left: 10px; }
  .banner-btn.next { right: 10px; }
  .banner-dots {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
  }
  .banner-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    border: none;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    padding: 0;
  }
  .banner-dot.active {
    background: var(--red);
    transform: scale(1.3);
  }
  @media (max-width: 480px) {
    .banner-slide img { max-height: 200px; }
    .banner-btn { width: 28px; height: 28px; font-size: 14px; }
  }

</style>
</head>

let selLayanan = null, selKategori = null;

function selectLayanan(l) {
  selLayanan = l;
  selKategori = null;
  document.querySelectorAll('#layanan-group .btn-option').forEach(b => {
    b.classList.toggle('active', b.textContent === l);
  });
  const cats = Object.keys(DATA[l]);
  const catCard = document.getElementById('kategori-card');
  const catGroup = document.getElementById('kategori-group');
  catGroup.innerHTML = '';
  cats.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'btn-option';
    btn.textContent = c;
    btn.onclick = () => selectKategori(c);
    catGroup.appendChild(btn);
  });
  catCard.style.display = 'block';
  document.getElementById('price-section').style.display = 'none';
  catCard.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function selectKategori(k) {
  selKategori = k;
  document.querySelectorAll('#kategori-group .btn-option').forEach(b => {
    b.classList.toggle('cat-active', b.textContent === k);
    b.classList.remove('active');
  });
  showPrices();
}

function showPrices() {
  const items = DATA[selLayanan]?.[selKategori];
  const sec = document.getElementById('price-section');
  const grid = document.getElementById('price-grid');
  const hdr = document.getElementById('price-header');
  hdr.textContent = `${selKategori} ${selLayanan}`.toUpperCase();
  grid.innerHTML = '';
  if (!items || items.length === 0) {
    grid.innerHTML = '<div class="no-data">Data tidak tersedia</div>';
    sec.style.display = 'block';
    return;
  }
  items.forEach(([qty, price]) => {
    const msg = `Halo Admin Poker Store! 🃏\nSaya mau order:\n\n✅ Layanan: ${selLayanan}\n📦 Kategori: ${selKategori}\n🔢 Jumlah: ${qty}\n💰 Harga: Rp ${price}\n\nMohon diproses ya, terima kasih!`;
    const a = document.createElement('a');
    a.className = 'price-item';
    a.href = waLink(msg);
    a.target = '_blank';
    a.addEventListener('click', function() {
      var msgs = [
        'Siap bos! 👍<br>Lagi buka WhatsApp~',
        'Mantap! 🃏<br>Admin segera balas ya!',
        'Oke bos! ✅<br>Pesanan masuk nih~',
        'Gas! 🚀<br>Boost sosmed jalan!'
      ];
      showChibiPopup(msgs[Math.floor(Math.random()*msgs.length)]);
    });
    a.innerHTML = `
      <div class="price-qty">${qty}</div>
      <div class="price-val">Rp ${price}</div>
      <div class="price-wa-hint">Tap untuk order via WhatsApp</div>
    `;
    a.addEventListener('click', function(e) {
      showChibi();
    });
    grid.appendChild(a);
  });
  sec.style.display = 'block';
  sec.scrollIntoView({behavior:'smooth', block:'nearest'});
}

var _chibiTimer = null;
function showChibiPopup(msg) {
  var popup = document.getElementById('chibi-popup');
  var bubble = document.getElementById('chibi-bubble');
  var card = document.getElementById('chibi-card');
  bubble.innerHTML = msg || 'Siap bos! 👍';
  popup.classList.remove('hide');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';
  popup.classList.add('show');
  if (_chibiTimer) clearTimeout(_chibiTimer);
  _chibiTimer = setTimeout(closeChibiPopup, 3500);
}
function closeChibiPopup() {
  var popup = document.getElementById('chibi-popup');
  popup.classList.add('hide');
  setTimeout(function(){ popup.classList.remove('show','hide'); }, 380);
}


// ── BANNER SLIDER ──
var _bannerIdx = 0;
var _bannerTotal = 2;
var _bannerAuto;
var _touchStartX = 0;

function bannerMove(dir) {
  _bannerIdx = (_bannerIdx + dir + _bannerTotal) % _bannerTotal;
  bannerUpdate();
  bannerResetAuto();
}
function bannerGo(idx) {
  _bannerIdx = idx;
  bannerUpdate();
  bannerResetAuto();
}
function bannerUpdate() {
  document.getElementById('bannerTrack').style.transform = 'translateX(-' + (_bannerIdx * 100) + '%)';
  document.querySelectorAll('.banner-dot').forEach(function(d, i) {
    d.classList.toggle('active', i === _bannerIdx);
  });
}
function bannerResetAuto() {
  clearInterval(_bannerAuto);
  _bannerAuto = setInterval(function(){ bannerMove(1); }, 4000);
}
// Touch swipe
var _slider = document.getElementById('bannerSlider');
if (_slider) {
  _slider.addEventListener('touchstart', function(e){ _touchStartX = e.touches[0].clientX; }, {passive:true});
  _slider.addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - _touchStartX;
    if (Math.abs(dx) > 40) bannerMove(dx < 0 ? 1 : -1);
  }, {passive:true});
}
bannerResetAuto();
